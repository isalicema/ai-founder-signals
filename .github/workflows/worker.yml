name: worker

# ⚠️ 定时已停用，改为本地 launchd 每天 06:00 跑。
#
# 原因（2026-08-29 实测）：YouTube 拦截数据中心 IP，Actions runner 上
# yt-dlp 直接报 "Sign in to confirm you're not a bot"，取不到任何字幕。
# 11 个可跑信源里 8 个是 YouTube，云端跑出来只剩标题卡，
# 「Mac 没开也能跑」换来的是个降级 feed，不划算。
#
# 保留 workflow_dispatch：数据库和 DeepSeek 在云端都是通的，
# 需要时可以手动触发跑非 YouTube 的部分（播客/文章）。
on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: '本次最多处理多少任务（手动补跑时可调小）'
        required: false
        default: '200'
      no_enqueue:
        description: '只消费现有队列，不新排 discover'
        type: boolean
        default: false

concurrency:
  # 同一时刻只跑一个 worker。队列本身用 SKIP LOCKED 已能并发安全，
  # 但串行跑更省事也更好排查。
  group: afs-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # YouTube 适配器取字幕要用。
      # ⚠️ 不要用 apt 里的 yt-dlp——发行版打包的版本通常落后好几个月，
      #    而 YouTube 页面结构常变，旧版会静默取不到字幕。用官方发布的二进制。
      - name: Install yt-dlp
        run: |
          sudo curl -sSL -o /usr/local/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version
      - name: Run worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AFS_LLM_PROVIDER: deepseek
          # 见 certs/README.md：补全 Let's Encrypt 新根的信任链，不是关校验
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/isrg-root-yr-by-x1.pem
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/letsencrypt-root-yr-by-x1.pem
        run: |
          set -o pipefail
          npx tsx tools/worker.ts \
            --max-jobs ${{ inputs.max_jobs || 200 }} \
            --budget-min 20 \
            ${{ inputs.no_enqueue && '--no-enqueue' || '' }} | tee /tmp/worker.log

      # 把结果写进 Actions 的运行摘要，不用点进日志翻
      - name: Summary
        if: always()
        run: |
          {
            echo '### AI Founder Signals · worker'
            echo '```'
            tail -20 /tmp/worker.log 2>/dev/null || echo '(没有输出，多半是前置步骤就失败了)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
