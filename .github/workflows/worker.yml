name: worker

on:
  schedule:
    # 北京时间每天 06:00 = UTC 22:00（前一天）。
    # 这个时间也刚好落在 DeepSeek 的平峰计价档（高峰是 UTC 01-04 与 06-10 工作日）。
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      max_jobs:
        description: '本次最多处理多少任务（手动补跑时可调小）'
        required: false
        default: '200'
      no_enqueue:
        description: '只消费现有队列，不新排 discover'
        type: boolean
        default: false

concurrency:
  # 同一时刻只跑一个 worker。队列本身用 SKIP LOCKED 已能并发安全，
  # 但串行跑更省事也更好排查。
  group: afs-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # YouTube 适配器取字幕要用。
      # ⚠️ 不要用 apt 里的 yt-dlp——发行版打包的版本通常落后好几个月，
      #    而 YouTube 页面结构常变，旧版会静默取不到字幕。用官方发布的二进制。
      - name: Install yt-dlp
        run: |
          sudo curl -sSL -o /usr/local/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version
      - name: Run worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AFS_LLM_PROVIDER: deepseek
        run: |
          set -o pipefail
          npx tsx tools/worker.ts \
            --max-jobs ${{ inputs.max_jobs || 200 }} \
            --budget-min 20 \
            ${{ inputs.no_enqueue && '--no-enqueue' || '' }} | tee /tmp/worker.log

      # 把结果写进 Actions 的运行摘要，不用点进日志翻
      - name: Summary
        if: always()
        run: |
          {
            echo '### AI Founder Signals · worker'
            echo '```'
            tail -20 /tmp/worker.log 2>/dev/null || echo '(没有输出，多半是前置步骤就失败了)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
